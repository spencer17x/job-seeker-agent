name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.17.0 install --frozen-lockfile

      - name: Run authoritative check
        run: corepack pnpm@11.17.0 check

      - name: Install Playwright Chromium
        run: corepack pnpm@11.17.0 exec playwright install --with-deps chromium

      - name: Run browser workflows
        run: corepack pnpm@11.17.0 test:e2e
